[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanler-gems-fault-discovery"
version = "0.1.0"
description = "Auditable geothermal fault hypotheses, blocked holdout evaluation, and fail-closed GeoTIFF release gates"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "rasterio>=1.4,<2", "scikit-learn>=1.6,<2", "requests>=2.32,<3", "pillow>=11,<14", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
