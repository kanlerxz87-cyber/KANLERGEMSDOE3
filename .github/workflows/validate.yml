name: Validate research workspace
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore hash-pinned public core, shared tools and nine anchors
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/restore_workspace.py --fetch --anchors > restore.log 2>&1
          status=$?
          cat restore.log
          if [ "$status" -ne 0 ]; then
            # Surface a concise diagnosis as a check annotation even when raw
            # Actions log downloads are unavailable in the research sandbox.
            message=$(tail -n 2 restore.log | tr '\n' ' ' | cut -c1-700)
            message=${message//'%'/'%25'}
            echo "::error title=Public input restoration failed::$message"
            exit "$status"
          fi
      - name: Unit and real-input evidence tests
        run: python -m pytest -q
      - run: node tests/test_browser.js
      - run: python scripts/build_site.py --check
