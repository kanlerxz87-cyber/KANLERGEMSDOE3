name: Validate research workspace
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore hash-pinned public core, shared tools and nine anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_workspace.py --fetch --anchors
      - name: Unit and real-input evidence tests
        run: python -m pytest -q
      - run: node tests/test_browser.js
      - run: python scripts/build_site.py --check
