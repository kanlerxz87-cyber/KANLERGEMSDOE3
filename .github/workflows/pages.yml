name: Verify and package static review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/install_template.py
      - run: PYTHON=python bash scripts/bootstrap_template.sh
      - run: python scripts/restore_instruments.py --profile saturation57
      # Fail before legacy tests can regenerate and conceal a stale/misleading page.
      - run: python scripts/build_site.py --check
      - run: python -m pytest -q
      - run: python scripts/check_run.py
      - run: python scripts/review.py && python scripts/build_site.py --check && git diff --exit-code
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
